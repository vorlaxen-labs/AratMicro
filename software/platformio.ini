; AratMicro — STM32F411CU6 micromouse firmware (Robosam / MEB Robot)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = aratmicro_f411
boards_dir = boards
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

; Shared compiler / type-safety settings
[common]
build_flags =
    -I include
    -std=gnu++17
    -Wall
    -Wextra
    -Wpedantic
    -Werror=return-type
check_tool = clangtidy
check_flags =
    clangtidy: --config-file=.clang-tidy
check_src_filters =
    +<src/>
    +<include/>
    +<lib/>
    +<test/>

[env:aratmicro_f411]
platform = ststm32
board = aratmicro_f411cu6
framework = arduino
build_type = release
build_flags =
    ${common.build_flags}
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
build_src_flags =
    -fno-exceptions
    -fno-rtti
build_unflags =
    -Og
check_tool = ${common.check_tool}
check_flags = ${common.check_flags}
check_src_filters = ${common.check_src_filters}

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${common.build_flags}
    -D ARATMICRO_HOST_TEST=1
build_src_flags =
    -fno-exceptions
    -fno-rtti
check_tool = ${common.check_tool}
check_flags = ${common.check_flags}
check_src_filters = ${common.check_src_filters}
